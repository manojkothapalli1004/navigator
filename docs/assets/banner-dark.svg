  <text x="224" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" fill="#9aaba3">Plans, builds and verifies a change. Then it waits for you.</text>

[project]
name = "navigator"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.6", "httpx>=0.27", "structlog>=24.1", "python-ulid>=2.2"]

[project.optional-dependencies]
sdk = ["claude-agent-sdk>=0.1"]   # v1; NOT used in v0
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
